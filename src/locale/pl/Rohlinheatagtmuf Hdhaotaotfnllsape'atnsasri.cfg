[string-mod-setting-description]
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<planet>_color-planet_both=Podmień LUTy używane dla południa i północy na te wybrane poniżej.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<planet>_color-planet_day=Podmień LUTy używane dla południa na te wybrane poniżej.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<planet>_color-planet_night=Podmień LUTy używane dla północy na te wybrane poniżej.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<planet>_color-planet_none=Nie podmieniaj żadnych LUTów.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<planet>_color-vanilla_both=Podmień całą tabelę LUTów na tą używaną przez Nauvis, a potem podmień LUTy używane dla południa i północy na te wybrane poniżej.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<planet>_color-vanilla_day=Podmień całą tabelę LUTów na tą używaną przez Nauvis, a potem podmień LUTy używane dla południa na te wybrane poniżej.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<planet>_color-vanilla_night=Podmień całą tabelę LUTów na tą używaną przez Nauvis, a potem podmień LUTy używane dla północy na te wybrane poniżej.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<planet>_color-vanilla_none=Podmień całą tabelę LUTów na tą używaną przez Nauvis.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<planet>_time-proportional=Zobacz jak długości określone poniżej różnią się od domyślnych dla Nauvis i zmień tabelę LUTów tej planety proporcjonalnie.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<planet>_time-literal=Po prostu ustaw długości dnia i nocy na takie jak określono poniżej.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<planet>_time-unchanged=Pozostaw długości dnia i nocy bez zmian.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-identity=Jest używany w bazowej grze do kolorów w dzień, zarówno w grze jak i w widoku przybliżenia mapy.\nW ogóle nie zmienia oryginalnych kolorów.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-vanilla_day=Znaleziony w bazowej grze, ale nie wydaje się być używany.\nSprawia, że kolory są jaśniejsze i bardziej nasycone. (Dość męczące dla oczu.)
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-vanilla_night=Jest używany w bazowej grze do kolorów w nocy w grze.\nSprawia, że wszystko jest ciemniejsze i dodaje niebieskie zabarwienia, ale ogólnie nadal możesz widzieć i grać normalnie. (Trochę ciemniejsze niż "Noc: Bazowa dla mapy".)
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-vanilla_mapNight=Jest używany w bazowej grze do kolorów w nocy, zarówno w grze jak i w widoku przybliżenia mapy.\nSprawia, że wszystko jest ciemniejsze i dodaje niebieskie zabarwienia, ale ogólnie nadal możesz widzieć i grać normalnie. (Trochę jaśniejsze niż "Noc: Bazowa".)
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-vanilla_nightVision=Jest używany w bazowej grze do noktowizji.\nSprawia, że wszystko jest delikatnie ciemniejsze i ma trochę mniejsze nasycenie, ale nadal możesz grać normalnie.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-mod_grayNight=Jest podobny do "Noc: Bazowa" (ta sama jasność) ale nasycenie wszystkich kolorów jest zerowe. (Wygląda trochę sztucznie w porównaniu do "Noc: Niebieska".)\nNadal możesz grać mniej więcej normalnie, ale możesz mieć problem z rozróżnieniem rodzajów taśmociągów, podajników i takich tam.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-mod_blueNight=Jest podobny do "Noc: Bazowa" (ta sama jasność) ale nasycenie wszystkich kolorów jest zerowe i ma niebieskie zabarwienie. (Wygląda bardziej naturalnie w porównaniu do "Noc: Szara" i jest przyjemniejszy dla oka.)\nNadal możesz grać mniej więcej normalnie, ale możesz mieć problem z rozróżnieniem rodzajów taśmociągów, podajników i takich tam.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-mod_darkNight=Kolory są takie jak "Noc: Bazowa", ale dużo ciemniejsze.\nW zależności od twojego monitora i ustawień, możesz nie być w stanie nawigować bez źródła światła.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-mod_grayDarkNight=Jest dużo ciemniejszy niż "Noc: Bazowa" i nasycenie wszystkich kolorów jest zerowe. (Wygląda troche sztucznie w porównaniu do "Noc: Niebieska ciemna".)\nW zależności od twojego monitora i ustawień, możesz nie być w stanie nawigować bez źródła światła, a nawet jeśli jesteś to będziesz mieć problem z rozróżnieniem rodzajów taśmociągów, podajników i takich tam.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-mod_blueDarkNight=Jest dużo ciemniejszy niż "Noc: Bazowa" i nasycenie wszystkich kolorów jest zerowe. (Wygląda bardziej naturalnie w porównaniu do "Noc: Szara ciemna" i jest przyjemniejszy dla oka.)\nW zależności od twojego monitora i ustawień, możesz nie być w stanie nawigować bez źródła światła, a nawet jeśli jesteś to będziesz mieć problem z rozróżnieniem rodzajów taśmociągów, podajników i takich tam.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-mod_imprDarkNight=Jest dużo ciemniejszy niż "Noc: Bazowa" i kolory inne niż niebieski są osłabione, co daje bardzo ładny nocny wygląd. (Wygląda bardziej naturalnie w porównaniu do "Noc: Ulepszona szara ciemna" i jest przyjemniejszy dla oka.)\nW zależności od twojego monitora i ustawień, możesz nie być w stanie nawigować bez źródła światła, a nawet jeśli jesteś to możesz mieć problem z rozróżnieniem rodzajów taśmociągów, podajników i takich tam.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-mod_imprGrayDarkNight=Jest dużo ciemniejszy niż "Noc: Bazowa", kolory inne niż niebieski są osłabione i nasycenie kolorów jest zerowe. (Wygląda sztucznie w porównaniu do "Noc: Ulepszona ciemna". Jest zrobiony głównie dla porządku.)\nW zależności od twojego monitora i ustawień, możesz nie być w stanie nawigować bez źródła światła, a nawet jeśli jesteś to możesz mieć problem z rozróżnieniem rodzajów taśmociągów, podajników i takich tam.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-mod_black=Jest kompletnie czarny.\nNie będziesz w stanie grać bez źródła światła.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-mod_greenishNightVision=Ma taką samą jasność jak "Noktowizja: Bazowa" ale dodaje zielony filtr.\nPowinieneś być w stanie rozróżniać kolory i grać normalnie.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-mod_grayNightVision=Ma taką samą jasność jak "Noktowizja: Bazowa" ale jest szary.\nNie będziesz w stanie rozróżnić kolorów, co utrudnia budowanie, ale powinieneś być w stanie walczyć normalnie.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-<group>_<target>_colors-mod_greenNightVision=Ma taką samą jasność jak "Noktowizja: Bazowa" ale jest zielony.\nNie będziesz w stanie rozróżnić kolorów, co utrudnia budowanie, ale powinieneś być w stanie walczyć normalnie.

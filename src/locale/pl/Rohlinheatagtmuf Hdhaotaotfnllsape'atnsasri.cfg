[mod-setting-description]
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-planet_color=Które LUTy kolorów powinny być podmienione dla planety __1__?
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-planet_time=Jak długość dnia / nocy powinna się zmienić dla planety __1__?
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-unknown_planet_color=Które LUTy kolorów powinny być podmienione dla planet, które nie są znane przez ten mod?\n\n* Ponieważ ten mod nie rozumie tabeli LUTów tych planet, będziesz musieć użyć tej standardowej z Nauvis.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-unknown_planet_time=Jak długość dnia / nocy powinna się zmienić dla planet, które nie są znane przez ten mod?\n\n* Ponieważ ten mod nie rozumie tabeli LUTów tych planet, to ustawienie jest ignorowane, jeśli "__1__" ma wartość "__2__".
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-game_colors=Ustawiania kolorów (i jasności), które będzie użyte w czasie __1__.\nDomyślne wartości:\n- ten mod -> "__2__"\n- bazowa -> "__3__"__4__
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-darkDayWarning=\n\nOstrzeżenie: Możesz ustawić tu noc, ale gra nie będzie poprawnie renderować niektórych świateł.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-nightVision_colors=Ustawienia kolorów (i jasności), które będzie użyte dla __1__.\nDomyślne wartości:\n- ten mod -> "__2__"\n- bazowa -> "__3__"
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-game_percent=Czas trwania __1__ jako procent całego dnia.\nDomyślne wartości:\n- ten mod -> __2__%\n- bazowa -> __3__%\n\n(Upewnij się, że ani (<czas __4__> / 2 + <czas __5__>) ani (<czas __4__> / 2 + <czas __6__>) nie przekracza 50.)\nOstrzeżenie: Gra nie będzie poprawnie renderować niektórych świateł, jeśli noc jest znacząco dłuższa niż bazowa. (Gra myśli, że jest już dzień i wyłącza światła.)
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-nightVision_percent=Wartość graniczna światła dnia, poniżej której gracz używa __1__, jako procent pomiędzy nocą a dniem.\n(Obliczenia używają bazowego czasu i długości nocy.)\nDomyślne wartości:\n- ten mod -> __2__%\n- bazowa -> __3__%
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-spacePlatforms_colors=Ustawienia kolorów (i jasności), które będzie użyte dla widoku __1__.\nDomyślne wartości:\n- ten mod -> "__2__"\n- bazowa -> "__3__"

[mod-name]
#Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri=Walić to, nie tłumaczę tego!

[mod-description]
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri=Pozwala dostosować długość dnia oraz wybrać jasność i kolor nocy, noktowizji i tak dalej.\n(To czysto graficzna zmiana, która nie wpływa na mechaniki gry.)\nDomyślne ustawienia to ciemnoniebieska noc i zielona noktowizja.\n\n"Fabryka pędzi,\npotrzeba rozbudowy,\nnatura nie da."


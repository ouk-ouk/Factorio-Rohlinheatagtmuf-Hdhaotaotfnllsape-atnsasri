[mod-setting-description]
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-planet_color=Which color LUTs for the planet __1__ should be replaced?
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-planet_time=How the day / night duration on the planet __1__ should be modified?
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-unknown_planet_color=Which color LUTs should be replaced for planets that aren't known by this mod?\n\n* Because the mod doesn't understand those planets' LUT tables, you have to use the vanilla one from Nauvis.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-unknown_planet_time=How the day / night duration should be modified on planets that aren't known by this mod?\n\n* Because the mod doesn't understand those planets' LUT tables, this setting is ignored if "__1__" is set to "__2__".
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-game_colors=Colors (and brightness) preset to be used during the __1__.\nDefault values:\n- this mod -> "__2__"\n- vanilla -> "__3__"__4__
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-darkDayWarning=\n\nWarning: You can set this to night but the game won't render some of the lights correctly.
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-nightVision_colors=Colors (and brightness) preset to be used when the __1__ is active.\nDefault values:\n- this mod -> "__2__"\n- vanilla -> "__3__"
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-game_percent=Duration of the __1__ as percent of the whole day.\nDefault values:\n- this mod -> __2__%\n- vanilla -> __3__%\n\n(Make sure that neither (<__4__ time> / 2 + <__5__ time>) nor (<__4__ time> / 2 + <__6__ time>) exceed 50.)\nWarning: The game won't render some of the lights correctly if the night is significantly longer than vanilla. (The game thinks it's day already and turns off the lights.)
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-nightVision_percent=Threshold of daylight below which the __1__ gets activated as percent between night and day.\n(The calculation uses night time and length from the vanilla game.)\nDefault values:\n- this mod -> __2__%\n- vanilla -> __3__%
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri-spacePlatforms_colors=Colors (and brightness) preset to be used when in the __1__ view.\nDefault values:\n- this mod -> "__2__"\n- vanilla -> "__3__"

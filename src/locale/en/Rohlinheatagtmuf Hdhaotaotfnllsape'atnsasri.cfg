[mod-name]
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri=Requirement of having lamps is not heavily enforced as they are generally the most useless fixtures. However, distributing high amount of them all over the factory no longer looks like such a pointless exercise, after the night stoped appearing so ridiculously inconsequantial.

[mod-description]
Rohlinheatagtmuf_Hdhaotaotfnllsape-atnsasri=Allows to adjust length of the day and choose brightness and color of the night, night-vision and so on.\n(This is a purely graphical change which does not affect the game mechanics.)\nBy default it is set to dark blue night and green nightvision.\n\n\"Factory moves fast,\ngrowth and maintenance required,\nnature does not let.\"

